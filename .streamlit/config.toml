[theme]
base = "dark"
primaryColor = "#6095FB"
backgroundColor = "#000E1B"
secondaryBackgroundColor = "#061A30"
textColor = "#F2F6FF"
borderColor = "#1B2C42"
# Prosperity pairs Oswald headlines with Mark Pro; Figtree is the open stand-in for Mark Pro.
# Streamlit accepts one family per source URL, so each font names its own.
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@300..800&display=swap"
headingFont = "Oswald:https://fonts.googleapis.com/css2?family=Oswald:wght@500..700&display=swap"
baseRadius = "large"
buttonRadius = "full"
linkColor = "#B2CCFF"

[ui]
hideTopBar = true

[client]
showErrorDetails = true
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
# The section fetches the recorded days and the font from ./static.
enableStaticServing = true
# Disable the source file-watcher. On Streamlit Community Cloud it serves no
# purpose (redeploys are git-driven), and it crawls every imported module's
# __path__ — which makes `transformers` eagerly import its vision models
# (vitpose/yolos/zoedepth), whose modules do top-level `torchvision` imports.
# This is a text-only RAG app (sentence-transformers all-MiniLM-L6-v2 needs
# torch, not torchvision), so those imports fail and spam ModuleNotFoundError
# at startup. Turning the watcher off silences them without pulling torchvision.
fileWatcherType = "none"
