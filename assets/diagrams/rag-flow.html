<desc id="diagram-desc">Everything except the Groq call runs inside the Streamlit process. The Streamlit app passes a question to GroqRagChain. The chain asks the combined retriever, which searches local vector stores for the wiki, trading data, and code and fuses the three rankings. The chain caps the context, sends one prompt to the Groq API, and returns the answer with its sources.</desc>
